<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081016" />
    <title>Boids / 10,000</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <aside class="main-controls" aria-label="Main controls">
        <section class="controls" aria-label="Simulation controls">
          <div class="mode-picker map-picker">
            <label for="simulation-mode">Simulation mode</label>
            <select id="simulation-mode" disabled>
              <option value="cpu">10,000 / CPU (WASM)</option>
              <option value="gpu">100,000 / GPU (WebGPU)</option>
            </select>
          </div>
          <p id="mode-status" class="hint">CPU simulation active.</p>
          <button id="send" disabled>
            <span>Send predator</span><span aria-hidden="true">↗</span>
          </button>
          <p class="hint" id="crossing-status">
            Each click launches another predator.
          </p>
          <div class="orbit-label">RESIDENT PREDATORS</div>
          <div class="stepper">
            <button id="remove" aria-label="Remove resident predator" disabled>
              −</button
            ><output id="count" aria-label="Orbiting predator count">0</output
            ><button id="add" aria-label="Add resident predator" disabled>
              +
            </button>
          </div>
          <p class="hint" id="orbit-caption">
            Circling 400 units from the centre.
          </p>
          <div class="map-picker">
            <label for="map-size">Map size</label>
            <select id="map-size" disabled>
              <option value="1024">1024 x 1024</option>
              <option value="512">512 x 512</option>
              <option value="256">256 x 256</option>
            </select>
          </div>
          <button id="reset-defaults" disabled>Reset to defaults</button>
          <p id="settings-status" class="hint">
            Changes save automatically in this browser.
          </p>
        </section>
        <footer>
          <div class="metric">
            <span>POPULATION</span><strong id="population-count">10,000</strong>
          </div>
          <div class="metric">
            <span>FRAME RATE</span
            ><strong><span id="fps">—</span><small> FPS</small></strong>
          </div>
          <div class="metric">
            <span id="simulation-label">SIMULATION</span
            ><strong
              ><span id="sim-ms">—</span
              ><small id="simulation-unit"> ms / tick</small></strong
            >
          </div>
        </footer>
      </aside>
      <section class="viewport" aria-label="Boid simulation">
        <div class="canvas-wrap">
          <canvas
            id="simulation"
            width="1024"
            height="1024"
            aria-label="10,000 boids moving in a wrapping square world"
          ></canvas>
          <canvas
            id="gpu-simulation"
            width="1024"
            height="1024"
            hidden
            aria-label="100,000 boids simulated on the GPU"
          ></canvas>
          <div id="status" role="status">
            Loading the flock<span class="loading">…</span>
          </div>
        </div>
      </section>
      <aside class="functor-settings" aria-label="Functor settings">
        <div
          id="parameter-controls"
          class="parameter-scroll"
          aria-label="Functor parameters"
        ></div>
      </aside>
    </main>
    <script src="boids.js"></script>
    <script src="app.js"></script>
  </body>
</html>
